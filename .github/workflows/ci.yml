name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "Directory.*"
      - "global.json"
      - "headless-sdk.slnx"
      - "nuget.config"
      - "logo.png"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "Directory.*"
      - "global.json"
      - "headless-sdk.slnx"
      - "nuget.config"
      - "logo.png"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  final-status:
    name: Final status
    if: always()
    needs:
      - validate
    runs-on: ubuntu-latest

    steps:
      # The validate call fails if any of its jobs (pack, every test shard, every platform smoke
      # leg) fails, so its single result covers them all.
      - name: Require every validation job
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "Validation failed: validate=$VALIDATE_RESULT"
            exit 1
          fi
