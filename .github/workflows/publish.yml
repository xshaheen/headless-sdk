name: Publish Packages

on:
  push:
    tags:
      - "*.*.*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize the package family across tags and manually selected refs. Different refs can resolve
  # to the same MinVer version, and publishing the six-package family is not transactional.
  # Release runs serialize in their own group: they wait for their tag-push run, which would
  # deadlock if both shared one group and the release run were queued first.
  group: ${{ github.event_name == 'release' && 'publish-headless-sdk-release' || 'publish-headless-sdk-packages' }}
  cancel-in-progress: false
  queue: max

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  validate:
    # A release publishes the packages its tag push already validated (publish-nuget-packages
    # below), so only tag pushes and manual runs build and test.
    if: github.event_name != 'release'
    uses: ./.github/workflows/validate.yml
    with:
      include-macos: true

  publish-github-packages:
    name: Publish GitHub Packages
    if: github.event_name != 'release'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: GitHub Packages
      url: https://github.com/xshaheen/headless-sdk/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: ./artifacts/packages-results

      - name: Publish packages to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./artifacts/packages-results/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts/packages-results."
            exit 1
          fi

          (
            cd ./artifacts/packages-results
            sha256sum --check SHA256SUMS
          )

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/xshaheen/index.json" \
              --api-key "$GH_TOKEN"
          done

  publish-nuget-packages:
    name: Publish NuGet.org Packages
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    environment:
      name: NuGet Release
      url: https://www.nuget.org/packages?q=Headless.NET.Sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      # Rebuilding here would repeat the full suite on a tag the tag-push run just validated, and
      # would ship different bytes to NuGet.org than to GitHub Packages.
      - name: Wait for the validated tag-push run
        id: tag-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish.yml \
            --event push \
            --branch "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No Publish run for the push of tag ${RELEASE_TAG} at ${RELEASE_SHA}."
            exit 1
          fi
          # Returns at once when the run has finished; the job timeout bounds the wait.
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then
            echo "Publish run ${run_id} for tag ${RELEASE_TAG} did not succeed; rerun it before publishing the release."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: ./artifacts/packages-results
          run-id: ${{ steps.tag-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify release artifacts
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          (
            cd ./artifacts/packages-results
            sha256sum --check SHA256SUMS
          )

          while IFS=$'\t' read -r package_id version; do
            if [[ "$version" != "$RELEASE_VERSION" ]]; then
              echo "${package_id} version '${version}' does not match release tag '${RELEASE_VERSION}'."
              exit 1
            fi
          done < ./artifacts/packages-results/PACKAGE_MANIFEST.tsv

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./artifacts/packages-results/*.nupkg)
          if [ ${#packages[@]} -ne 6 ]; then
            echo "Expected exactly six .nupkg files; found ${#packages[@]}."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY"
          done
